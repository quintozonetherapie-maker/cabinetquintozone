<!DOCTYPE html>
<html lang="fr" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cabinet de Fred & SCM Quintozone</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: {} }
        }
    </script>
    <style>
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.25s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-slate-100 dark:bg-slate-950 text-slate-800 dark:text-slate-100 pb-28 transition-colors duration-200">

    <!-- En-tête -->
    <header class="bg-gradient-to-r from-blue-900 via-blue-800 to-sky-800 text-white shadow-lg sticky top-0 z-50">
        <div class="flex justify-between items-center max-w-2xl mx-auto px-4 py-3.5">
            <h1 class="text-lg font-bold flex items-center gap-2.5 tracking-tight">
                <div class="bg-white/15 p-2 rounded-xl backdrop-blur-md shadow-inner">
                    <i class="fa-solid fa-user-doctor text-sky-200"></i>
                </div>
                Cabinet de Fred & SCM
            </h1>
            <div class="flex items-center gap-2">
                <span id="header-date" class="text-xs bg-black/20 px-3 py-1.5 rounded-full font-medium backdrop-blur-md border border-white/10 hidden sm:inline"></span>
                <button onclick="toggleDarkMode()" class="bg-white/15 hover:bg-white/25 px-3 py-1.5 rounded-full text-xs font-bold backdrop-blur-md transition-colors" title="Changer de thème">
                    <i id="theme-icon" class="fa-solid fa-moon"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-2xl mx-auto p-4 space-y-4 mb-16">
        
        <!-- ONGLET 1 : ACCUEIL -->
        <section id="tab-accueil" class="tab-content active space-y-4">
            <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-4.5 rounded-2xl shadow-sm">
                <h2 class="text-sm font-bold text-blue-900 dark:text-sky-400 mb-3 flex items-center gap-2 uppercase tracking-wide">
                    <span class="w-2 h-2 rounded-full bg-sky-500 animate-pulse"></span>
                    Rappel du jour (<span id="today-date-label"></span>)
                </h2>
                <div id="today-appointments-list" class="space-y-3"></div>
            </div>

            <div class="bg-white dark:bg-slate-900 border-2 border-emerald-500/30 p-4.5 rounded-2xl shadow-sm space-y-3">
                <div class="flex justify-between items-center">
                    <h2 class="text-sm font-bold text-emerald-800 dark:text-emerald-400 flex items-center gap-2 uppercase tracking-wide">
                        <i class="fa-solid fa-comment-sms text-emerald-600 dark:text-emerald-400"></i> Rappels SMS
                    </h2>
                    <input type="date" id="sms-target-date" class="p-2 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-xs font-semibold text-emerald-800 dark:text-emerald-400" onchange="renderTargetSms()">
                </div>
                <p class="text-xs text-slate-500 dark:text-slate-400">Patients prévus à cette date :</p>
                <div id="target-sms-list" class="space-y-3"></div>
            </div>

            <div class="grid grid-cols-2 gap-3.5">
                <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-4 rounded-2xl shadow-sm text-center">
                    <span class="text-xs text-slate-500 dark:text-slate-400 uppercase font-bold tracking-wider">Patients Actifs</span>
                    <p id="stat-total-patients" class="text-3xl font-extrabold text-blue-800 dark:text-sky-400 mt-1">0</p>
                </div>
                <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-4 rounded-2xl shadow-sm text-center">
                    <span class="text-xs text-slate-500 dark:text-slate-400 uppercase font-bold tracking-wider">CA Mois (Cabinet)</span>
                    <p id="stat-ca-mois" class="text-3xl font-extrabold text-sky-700 dark:text-emerald-400 mt-1">0,00 €</p>
                </div>
            </div>
            
            <div class="bg-gradient-to-br from-blue-700 to-sky-700 text-white p-4 rounded-2xl shadow-md flex justify-between items-center">
                <div>
                    <h3 class="font-bold text-sm">Nouveau dossier patient ?</h3>
                    <p class="text-xs text-blue-100 mt-0.5">Attribuez ou modifiez le numéro de dossier librement.</p>
                </div>
                <button onclick="openPatientModal()" class="bg-white text-blue-900 px-4 py-2.5 rounded-xl text-xs font-bold shadow hover:bg-blue-50 transition-colors flex items-center gap-2">
                    <i class="fa-solid fa-plus"></i> Créer
                </button>
            </div>
        </section>

        <!-- ONGLET 2 : PATIENTS -->
